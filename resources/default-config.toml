# Flux Terminal Configuration
#
# Edit this file to customize Flux. Changes take effect on restart.
# (Hot-reload coming in a future release.)
#
# All colors are hex RGB (e.g., "#7aa2f7").

# Config schema version. Bumped when Flux grows a field that older
# defaults can't auto-fill. If you're editing this by hand you almost
# always want the current value — older values are migrated forward
# automatically on load.
version = 1

[font]
# Font family — must be installed on your system.
# Common monospace fonts: "Menlo", "JetBrains Mono", "Fira Code",
# "SauceCodePro Nerd Font Mono", "SF Mono"
family = "Menlo"

# Font size in points (same units as iTerm2 / VS Code).
size = 14.0

# Font weight: "normal" or "bold"
weight = "normal"

# Font style: "normal" or "italic"
style = "normal"

# Line height multiplier. 1.0 = tight, 1.2 = normal, 2.0 = spacious.
# iTerm2's "Vertical Spacing" uses the same multiplier.
line_height = 1.2

[window]
# Window title.
title = "Flux — 1.21 gigawatts"

# Default window size in logical pixels.
width = 1200
height = 800

# Padding in logical pixels between the window edge and the terminal grid.
padding_horizontal = 10
padding_vertical = 10

[theme]
# The complete color theme, spelled out so every knob is visible.
# This is Tokyo Night Storm — change any value to make it yours, or
# delete a key to fall back to the same built-in default.
# (Named theme files in ~/.config/flux/themes/ are a future release;
# that folder is scaffolding for now.)

# Terminal background color.
background = "#24283b"

# Default text (foreground) color.
foreground = "#c0caf5"

# Cursor color. Defaults to foreground when omitted.
cursor = "#c0caf5"

# ANSI colors 0-7.
black   = "#414868"
red     = "#f7768e"
green   = "#73daca"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

# Bright variants (ANSI 8-15).
bright_black   = "#6a7799"
bright_red     = "#ff99a8"
bright_green   = "#b8e986"
bright_yellow  = "#f4cc70"
bright_blue    = "#9cc1ff"
bright_magenta = "#d6b3ff"
bright_cyan    = "#a3e6ff"
bright_white   = "#e0e6ff"

# Header tint for completed commands (the prompt + command rows of
# each block in the output). Derived from `background` when unset —
# a shade lighter on dark themes, a shade darker on light ones.
# Failed commands get the same tint with a little `red` mixed in.
# block_header = "#303549"

# Padding color while a full-screen program (vim, Claude Code) runs:
#   "sync"      adopt the program's background (default; vim fills the
#               window edge-to-edge)
#   "theme"     keep the background above, always
#   "#rrggbb"   pin to any fixed color
# alt_screen_background = "sync"

[theme.ui]
# Every chrome color, individually overridable. Defaults derive from
# the palette above (accent = blue, dim = bright_black, …), so most
# themes only need [theme]; set keys here to override single slots.
# 8-digit hex sets alpha where it matters (selection, search tints,
# scrollbar, sticky header backgrounds).
#   accent, divider, cursor, cursor_text,
#   selection, search_match, search_focus,
#   scrollbar_thumb, scrollbar_track,
#   tab_bg, tab_text, tab_focused_bg, tab_focused_text,  # sidebar panel
#   sidebar_running,
#   input_text, input_dim,
#   popup_bg, popup_selected_bg, popup_directory, popup_file, popup_symlink,
#   notice_bg, notice_text,
#   sticky_bg, sticky_failed_bg, sticky_text, sticky_failed_text,
#   pane_accent
# Examples:
# accent    = "#ff9e64"
# selection = "#7aa2f74d"   # last byte = opacity

[sidebar]
# The left tab panel: current folder, branch, and a running-command
# dot per tab. Cmd+B (toggle_sidebar) or the panel icon shows/hides it.
visible = true
# Width in logical pixels.
width = 230

[scrollback]
# Scrollback capacity in lines. 0 disables history entirely.
# Memory cost is roughly proportional (~100 bytes/line-cell row).
lines = 10000

# Padding tint while scrolled up into history — a quiet "not at the
# live tail" cue. Any hex color; leave unset for no change.
# scrolled_background = "#2a2f45"

[blocks]
# The semantic stream. With shell integration on, Flux hides the
# shell's own prompt while you type (the input bar below is the
# prompt), tints each completed command's prompt + command rows as a
# header, and marks failures in red with the exit code. Set to false
# for the classic stream with the shell prompt visible.
enabled = true

[keys]
# Keyboard shortcuts. Each line rebinds one action; leave a line out to
# keep its default, set it to "" to unbind it. Modifiers: cmd (also
# super), ctrl, alt (also opt), shift. Keys: a single character, or up,
# down, left, right, enter, tab, escape, backspace, delete, home, end,
# pageup, pagedown, space, f1-f12. Modifiers must match exactly.
# Defaults shown (macOS):
# new_tab          = "cmd+t"
# close_tab        = "cmd+w"
# next_tab         = "cmd+]"
# prev_tab         = "cmd+["
# tab_1            = "cmd+1"      # … through tab_9
# find             = "cmd+f"
# copy             = "cmd+c"      # copies when text is selected
# copy_block_output = "cmd+shift+c"  # last finished block's output
# paste            = "cmd+v"
# undo             = "cmd+z"
# redo             = "cmd+shift+z"
# scroll_line_up   = "alt+up"
# scroll_line_down = "alt+down"
# scroll_page_up   = "pageup"
# scroll_page_down = "pagedown"
# prev_block       = "cmd+up"     # move the block highlight up
# next_block       = "cmd+down"
# split_right      = "cmd+d"
# split_down       = "cmd+shift+d"
# close_pane       = "cmd+shift+w"
# focus_pane_left  = "cmd+alt+left"    # …_right, _up, _down
# toggle_sidebar   = "cmd+b"
